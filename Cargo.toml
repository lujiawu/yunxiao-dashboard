[workspace]
resolver = "2"
members = ["crates/core", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
taskdash-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = "0.9.1"

# GPUI renders far too slowly in a plain debug build; this is the upstream
# recommendation and does not speed compilation up.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-kit]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
